name: CMS release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Stage a candidate, or deploy it after verification
        type: choice
        options: [stage, deploy]
        default: stage
permissions:
  contents: read
concurrency:
  group: fanruan-cloud-cms-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ steps.release.outputs.release }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test application and deployment failure recovery
        run: |
          python3 -m unittest discover -s deploy/tests
          node --test tests/*.test.js
      - id: release
        run: echo "release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable production image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/international-group/fanruan-cloud-cms:${{ steps.release.outputs.release }}
          build-args: |
            RELEASE_ID=${{ steps.release.outputs.release }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fanruan-cloud-cms
          cache-to: type=gha,scope=fanruan-cloud-cms,mode=max,ignore-error=true
          provenance: mode=min
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify candidate and activate
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build.outputs.release }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_MODE: ${{ github.event.inputs.mode == 'stage' && 'stage' || 'deploy' }}
        run: python3 deploy/scripts/release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: deployment-${{ needs.build.outputs.release }}
          path: deployment-result.json
          if-no-files-found: ignore
          retention-days: 90
